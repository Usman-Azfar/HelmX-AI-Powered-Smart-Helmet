[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helmx-drowsiness"
version = "0.1.0"
description = "Research-grade, quality-aware temporal driver drowsiness detection"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [
  { name = "Usman-Azfar", email = "usmanazfarshafiq@gmail.com" },
]
keywords = [
  "computer-vision",
  "driver-monitoring",
  "drowsiness-detection",
  "edge-ai",
  "onnx",
  "pytorch",
  "temporal-modeling",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mediapipe>=1.0,<2",
  "numpy>=2.0,<3",
  "onnxruntime>=1.20,<2",
  "opencv-contrib-python>=4.10,<6",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "rich>=13,<16",
]

[project.optional-dependencies]
data = [
  "gdown>=6,<7",
  "kagglehub>=1,<2",
]
train = [
  "matplotlib>=3.9,<4",
  "optuna>=4,<5",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "seaborn>=0.13,<1",
  "timm>=1,<2",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
  "tqdm>=4.66,<5",
]
export = [
  "onnx>=1.17,<2",
  "onnxscript>=0.5,<1",
]
dev = [
  "mypy>=1.15,<3",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
helmx-drowsiness = "helmx_drowsiness.cli:main"

[project.urls]
Homepage = "https://github.com/Usman-Azfar/HelmX-AI-Powered-Smart-Helmet"
Documentation = "https://github.com/Usman-Azfar/HelmX-AI-Powered-Smart-Helmet/tree/drowsiness-detection-model#readme"
Issues = "https://github.com/Usman-Azfar/HelmX-AI-Powered-Smart-Helmet/issues"
Repository = "https://github.com/Usman-Azfar/HelmX-AI-Powered-Smart-Helmet.git"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["helmx_drowsiness"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["helmx_drowsiness"]

[[tool.mypy.overrides]]
module = [
  "cv2.*",
  "mediapipe.*",
  "onnxruntime.*",
  "pandas.*",
  "sklearn.*",
  "scipy.*",
  "torchvision.*",
]
ignore_missing_imports = true

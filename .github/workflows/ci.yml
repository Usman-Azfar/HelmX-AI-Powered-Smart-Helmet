name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-test.txt
      - name: Compile Python sources
        run: python -m compileall -q src scripts deploy tests
      - name: Check public release contents
        run: python scripts/check_public_release.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

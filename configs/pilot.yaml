schema_version: 1
seed: 13

data:
  manifest: data/processed/uta-rldd-frame-pilot/manifest.csv
  image_size: 128
  sequence_length: 4
  sample_fps: 1.0
  calibration_seconds: 5.0
  window_stride: 4
  num_workers: 4
  augmentation: true
  # This third-party frame mirror contains only active/fatigue labels.
  label_names: [active, fatigue]

model:
  fusion_mode: visual_only
  backbone: mobilenetv3_small_100
  pretrained: true
  eye_pretraining_checkpoint: runs/mrl-eye/best_eye_backbone.pt
  physiology_features: 12
  physiology_standardized_clip: 10.0
  hidden_size: 96
  temporal_blocks: 2
  dropout: 0.20
  num_classes: 2

training:
  epochs: 10
  batch_size: 16
  learning_rate: 0.0003
  # See configs/default.yaml for the rationale (discriminative rate for the pretrained backbone).
  backbone_learning_rate: 0.00003
  weight_decay: 0.0001
  label_smoothing: 0.05
  mixed_precision: true
  gradient_accumulation: 2
  early_stopping_patience: 3
  seeds: [13]
  # This pilot never supplied eye/yawn/head-pose/quality labels either; see default.yaml.
  loss_weights:
    classification: 1.0
    eye_closure: 0.0
    yawn: 0.0
    head_pose: 0.0
    quality: 0.0

alert:
  caution_probability: 0.55
  warning_probability: 0.72
  critical_probability: 0.88
  release_probability: 0.40
  caution_seconds: 1.5
  warning_seconds: 2.0
  critical_seconds: 3.5
  release_seconds: 2.0
  unavailable_seconds: 1.0
  alarm_cooldown_seconds: 3.0
